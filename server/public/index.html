<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Place demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="title">
          <div class="h1">Place</div>
          <div class="sub">Realtime pixel board via WebSockets + MongoDB</div>
        </div>
        <div class="pill-row">
          <span id="status" class="pill pill--bad" aria-live="polite">Disconnected</span>
          <span id="presence" class="pill">— online</span>
          <span id="cooldown" class="pill pill--muted">Ready</span>
        </div>
      </header>

      <main class="main">
        <section class="boardPane" aria-label="Board">
          <div class="boardWrap" id="boardWrap">
            <canvas id="board" width="960" height="640"></canvas>
          </div>
          <div class="help">
            <div><b>Paint</b>: click a pixel</div>
            <div><b>Pan</b>: drag / touch drag</div>
            <div><b>Zoom</b>: Ctrl+wheel (or trackpad pinch). Double-click to reset.</div>
          </div>
        </section>

        <aside class="side" aria-label="Controls">
          <section class="card">
            <div class="cardTitle">Color</div>
            <div class="colorRow">
              <div id="swatch" class="swatch" aria-label="Selected color"></div>
              <input id="color" type="color" value="#ff4500" aria-label="Pick color" />
            </div>
            <div id="palette" class="palette" role="list" aria-label="Palette"></div>
          </section>

          <section class="card">
            <div class="cardTitle">Snapshot</div>
            <div class="btnRow">
              <button id="export" type="button">Export JSON</button>
              <label class="fileBtn">
                Import JSON
                <input id="import" type="file" accept="application/json" />
              </label>
            </div>
            <div class="small">
              Export downloads the current board. Import replaces the board in MongoDB and broadcasts a refresh.
            </div>
          </section>
        </aside>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
